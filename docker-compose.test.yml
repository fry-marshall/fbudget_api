services:

  api:
    build:
      context: .
      target: dev
    container_name: fbudget_api_test
    command: npm run test:e2e -- --forceExit
    env_file: .env.test
    volumes:
    - .:/app
    - /app/node_modules
    depends_on:
      db_test:
        condition: service_healthy

  db_test:
    image: postgres:15-alpine3.24
    container_name: fbudget_api_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fbudget_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5